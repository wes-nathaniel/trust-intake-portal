# Production supervisor config for the FastAPI backend (deployment image).
# The preview environment uses /etc/supervisor/conf.d/supervisord.conf on the
# preview pod (which is platform-managed and read-only). This file is what the
# deploy pipeline uses for the production container per Emergent Support
# guidance (2026-07-15) — workers bumped from 1 to 2 so a single long-running
# LLM/PDF background task cannot starve the request loop.
[program:backend]
command=/root/.venv/bin/uvicorn server:app --host 0.0.0.0 --port 8001 --workers 2
directory=/app/backend
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/backend.err.log
stdout_logfile=/var/log/supervisor/backend.out.log
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
